name: operational_tracking
description: App offline-first para fiscalizacao e acompanhamento de obras.
publish_to: "none"

version: 0.1.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  image_picker: ^1.1.2
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0
  photo_manager: ^3.12.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  sqlite3: ^2.4.5

flutter:
  uses-material-design: true
